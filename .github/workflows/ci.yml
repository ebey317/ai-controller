# Continuous Integration workflow
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.9
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff is PINNED to the version in .pre-commit-config.yaml (v0.1.1).
          # Unpinned `pip install ruff` = latest, which drifts and red-lights
          # the whole repo on style rules the project never adopted (found
          # 2026-10-19: latest 0.16.7 flagged 17 files; the pinned version is
          # the single source of truth, same doctrine as master-ai-cli's CI).
          pip install pytest pytest-cov "ruff==0.1.1" black isort shellcheck-py pre-commit
          # Runtime deps the test suite imports transitively. All of these
          # are plain-pip packages with prebuilt wheels on ubuntu-24.04 --
          # no system libraries to install first. tests/test_voice_bridge.py
          # imports voice_bridge (needs httpx/fastapi; TestClient also
          # needs python-multipart for File()/Form() routes).
          # tests/test_voice_fx.py, tests/test_controller_setup.py, and
          # tests/test_voice_loop.py import numpy/scipy for real signal
          # processing. tests/test_controller_setup.py's edge-tts doctor
          # checks need edge-tts actually importable to exercise their OK
          # path, not just their already-covered WARN/missing path.
          #
          # Deliberately NOT installed, even though requirements.txt lists
          # them: pycairo (needs system libcairo2-dev to build at all --
          # confirmed 2026-11-02, fails with "Dependency cairo not found"
          # on a bare runner) and evdev/pynput. All three are used only by
          # GTK/X11 desktop scripts (slide_keyboard.py, controller-legend.py,
          # a_button_double_tap_enter.py) that no test file imports -- same
          # reasoning as the gi skip in tests/test_setup_panel.py below.
          pip install httpx fastapi python-multipart numpy scipy edge-tts
      - name: Run linters
        run: |
          ruff check .
          shellcheck scripts/*.sh
      - name: Run tests
        run: |
          pytest --tb=short -v --cov=scripts --cov=tests --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Upload coverage report
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v3.1.1
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          # Tokenless uploads are rate-limited by Codecov and returned
          # HTTP 429 ("Rate limit reached. Please upload with the Codecov
          # repository upload token"). A third-party upload service being
          # throttled says nothing about whether the code is correct, so it
          # should not fail the build. To make this step enforcing, add a
          # CODECOV_TOKEN repository secret and flip this back to true.
          fail_ci_if_error: false
          verbose: true