# Continuous Integration workflow
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff black isort shellcheck-py pre-commit
          # Runtime deps the test suite imports transitively:
          # tests/test_voice_bridge.py imports voice_bridge, which imports
          # httpx and fastapi, and registers File()/Form() routes (TestClient
          # also needs httpx). Missing any of these made test collection fail.
          pip install httpx fastapi python-multipart
      - name: Run linters
        run: |
          ruff check .
          shellcheck scripts/*.sh
      - name: Run tests
        run: |
          pytest --tb=short -v --cov=scripts --cov=tests --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true