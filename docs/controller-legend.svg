<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380">
  <style>
    body { font-family: "Segoe UI", "Inter", sans-serif; }
    .btn { fill: #f0f0f0; stroke: #444444; stroke-width: 2; }
    .btn-active { fill: #ff6a00; stroke: #e05c00; stroke-width: 2; }
    .btn-label { font-size: 10px; font-weight: 500; fill: #222222; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .title { font-size: 14px; font-weight: 600; fill: #333333; }
    .subtitle { font-size: 9px; fill: #666666; }
    .footnote { font-size: 8px; fill: #888888; text-anchor: middle; }
  </style>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260.0" y="20" class="title" text-anchor="middle">Controller Legend</text>
  <!-- Xbox-style controller body -->
  <path d="M 130,90 C 90,90 60,110 55,150 C 50,190 55,230 75,260 C 90,282 110,290 125,275 C 138,262 140,240 150,225 C 165,205 190,195 220,192 L 300,192 C 330,195 355,205 370,225 C 380,240 382,262 395,275 C 410,290 430,282 445,260 C 465,230 470,190 465,150 C 460,110 430,90 390,90 C 360,80 340,85 320,95 C 300,88 220,88 200,95 C 180,85 160,80 130,90 Z" fill="#e2e2e2" stroke="#9a9a9a" stroke-width="2"/>
  <!-- D-pad -->
  <rect x="144" y="239" width="12" height="32" rx="3" fill="#f5f5f5" stroke="#888888"/>
  <rect x="134" y="249" width="32" height="12" rx="3" fill="#f5f5f5" stroke="#888888"/>
  <circle cx="150" cy="150" r="20" class="btn btn-active"/>
  <text x="150" y="150" class="btn-label">L3</text>
  <circle cx="370" cy="255" r="20" class="btn btn-active"/>
  <text x="370" y="255" class="btn-label">R3</text>
  <circle cx="370" cy="122" r="15" class="btn btn-active"/>
  <text x="370" y="122" class="btn-label">Y</text>
  <circle cx="343" cy="150" r="15" class="btn btn-active"/>
  <text x="343" y="150" class="btn-label">X</text>
  <circle cx="397" cy="150" r="15" class="btn btn-active"/>
  <text x="397" y="150" class="btn-label">B</text>
  <circle cx="370" cy="178" r="15" class="btn btn-active"/>
  <text x="370" y="178" class="btn-label">A</text>
  <circle cx="225" cy="100" r="20" class="btn btn-active"/>
  <text x="225" y="100" class="btn-label" style="font-size:7px">View/Back</text>
  <circle cx="295" cy="100" r="14" class="btn btn-active"/>
  <text x="295" y="100" class="btn-label">Menu</text>
  <rect x="135.0" y="61.0" width="30" height="14" rx="7.0" class="btn btn-active"/>
  <text x="150" y="68" class="btn-label">LB</text>
  <rect x="355.0" y="61.0" width="30" height="14" rx="7.0" class="btn btn-active"/>
  <text x="370" y="68" class="btn-label">RB</text>
  <rect x="137.0" y="35.0" width="26" height="10" rx="5.0" class="btn btn-active"/>
  <text x="150" y="40" class="btn-label">LT</text>
  <rect x="357.0" y="35.0" width="26" height="10" rx="5.0" class="btn btn-active"/>
  <text x="370" y="40" class="btn-label">RT</text>
  <text x="150" y="289" class="subtitle" text-anchor="middle">D-Pad</text>
  <!-- Footnote - shown for marketing context -->
  <text x="260.0" y="356" class="footnote">
    Shown on an Xbox-style layout — works the same on any standard controller
  </text>
  <text x="260.0" y="367" class="footnote">
    View/Back currently sends script:toggle-slide-keyboard.sh · Menu currently sends Tab
  </text>
