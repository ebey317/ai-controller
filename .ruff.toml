# Ruff configuration
# (.ruff.toml IS the ruff namespace — settings live at top level,
#  sub-tables drop the [tool.ruff.*] prefix used in pyproject.toml)
# Scope: real defects + import hygiene. Opinion rules (ANN/ARG/PLR/etc.)
# excluded deliberately — this is a CLI product where prints, asserts,
# and loose signatures are the working style.
line-length = 88
target-version = "py39"

[lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]
"scripts/*" = ["S101", "E402"]  # scripts bootstrap sys.path before their imports, by design
# Root-level headless smoke test. It sets env vars and installs mocks BEFORE
# importing ptt_pynput, so the late imports are load-bearing, not sloppiness.
"test_headless_mode.py" = ["S101", "E402"]
# FastAPI's File()/Form() in parameter defaults is the framework idiom
"scripts/voice_bridge.py" = ["B008"]
# Retired worker (2026-10-31, see tahuti_goal_runner.py's RETIRED comment):
# the standalone approval UI process it replaced. Not imported or run by
# anything live -- kept on disk for reference only. Its loop-closure
# captures are real B023 findings, but hand-patching 20 of them in code
# with no test coverage and no execution path risks introducing a
# behavior change nobody can verify. Delete the file instead of fixing
# its lint once it's confirmed nothing still depends on it.
"scripts/tahuti_approval_ui.py" = ["B023"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false