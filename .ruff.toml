# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "N", "B", "Q", "TCH", "ANN", "ARG", "ASYNC", "ERA", "RET", "SIM", "PTH", "COM", "DJ", "DTZ", "FIX", "PERF", "PIE", "PLC", "PLE", "PLR", "PLW", "RSE", "RUF", "S", "T20", "TID", "UP", "YTT"]
ignore = ["E501", "W503", "W504"]

[tool.ruff.format]
line-length = 88
indent-width = 4
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]
"scripts/*" = ["S101"]