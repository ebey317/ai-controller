[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-controller"
version = "1.0.0"
description = "Xbox controller to keyboard/mouse/voice mapping for desktop accessibility"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Elijah Wilkins", email = "ebey317@gmail.com"}]
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn",
    "pynput",
    "numpy",
    "scipy",
    "edge-tts",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*", "__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
